name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

env:
  RACK_ENV: development
  S3_REAL: true
  S3_REGION: us-east-1
  S3_BUCKET: minio-bucket
  S3_ACCESS_KEY_ID: weak_key
  S3_SECRET_ACCESS_KEY: weak_key
  S3_ENDPOINT: http://localhost:9000
  MINIO_ROOT_USER: weak_key
  MINIO_ROOT_PASSWORD: weak_key

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "jruby-10.1"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          rubygems: latest

      - name: Set up Minio
        run: |
          # MinIO no longer publishes binaries at dl.min.io, so we pin an old image
          mkdir -p "${GITHUB_WORKSPACE}"/minio/data/minio-bucket
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            -v "${GITHUB_WORKSPACE}"/minio/data:/data \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --address :9000
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/ready; do sleep 1; done'

      - name: Run tests
        run: bundle exec rake test
